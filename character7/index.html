<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>表单</title>
</head>
<body>
    <h1>用户信息表</h1>
    <form nome="userinfo" action="127.0.0.1/userinfo" method="post">
    <div>
        <label for="username">用户名<font color="red">*</font>:</label>
        <input type="text" id="username" name="username" placeholder="4-16个字符" maxlength="16" minlength="4" required>
        <br>
        <label for="password" >密码<font color="red">*</font>:</label>
        <input type="password" id="password" name="password" placeholder="密码">
        <br>
        <input type="submit" value="提交">
    </div>
</form>
</body>
</html>
