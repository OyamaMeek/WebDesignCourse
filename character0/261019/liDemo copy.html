<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开封菊展品种简介</title>
  <style>
    .slide ul { list-style: none; }
    .slide ul li {
      font-size: 1.22rem;
      line-height: 1.75;
      padding-left: 26px;
      position: relative;
      margin-bottom: 4px;
    }
    .slide ul li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: #6366f1;
      font-weight: bold;
    }
     /* 综合案例专用样式 */
    .chrysanthemum-demo {
      background: #fffaf0;
      border: 1px solid #f6e3b4;
      border-radius: 12px;
      padding: 20px 25px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    .chrysanthemum-demo h3 {
      color: #b45309;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .chrysanthemum-demo .sub-title {
      font-size: 1.15rem;
      color: #92400e;
      font-weight: bold;
      margin: 10px 0 6px;
      border-bottom: 1px dashed #fcd34d;
      padding-bottom: 4px;
    }
    .chrysanthemum-demo ul, .chrysanthemum-demo ol, .chrysanthemum-demo dl {
      padding-left: 22px;
      font-size: 1.05rem;
      line-height: 1.8;
    }
    .chrysanthemum-demo ul { list-style-type: disc; color: #78350f; }
    .chrysanthemum-demo ol { list-style-type: decimal; color: #78350f; }
    .chrysanthemum-demo dt {
      font-weight: bold;
      color: #b45309;
      margin-top: 8px;
    }
    .chrysanthemum-demo dd {
      margin-left: 20px;
      color: #57534e;
      font-size: 1rem;
    }
  </style>
</head>
<body>
<div>
  <!-- ========== 新增：综合案例 · 开封菊展 ========== -->
  <div class="slide">
    
  </div>

</div>


</body>
</html>
